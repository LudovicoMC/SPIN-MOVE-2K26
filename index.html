<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIN MOVE 2K26</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Permanent Marker -->
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col">

    <!-- HEADER BRANDING -->
<header class="bg-[#FF5100] shadow-md py-2 px-4 overflow-hidden">
    <div class="max-w-7xl mx-auto flex items-center justify-center relative">
        <img src="logo.png" alt="Spin Move Logo" class="h-20 md:h-28 w-auto object-contain -mr-3 md:-mr-5 z-10 drop-shadow-md pointer-events-none">
        
        <!-- Rimosso pt-1 e aggiunto leading-none per centrare perfettamente il testo -->
        <h1 class="text-3xl md:text-5xl uppercase tracking-wider text-white whitespace-nowrap z-0 leading-none drop-shadow-md" style="font-family: 'Permanent Marker', cursive;">
            SPIN MOVE 2K26
        </h1>
    </div>
</header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-5xl">
        
        <!-- SELEZIONE CATEGORIA (visibile di default) -->
        <div id="category-selection" class="flex flex-col sm:flex-row gap-4 justify-center items-center my-8">
            <button onclick="selectCategory('maschile')" class="w-full sm:w-64 bg-orange-500 hover:bg-orange-400 text-white font-bold py-6 px-8 rounded-2xl shadow-lg transition-all text-xl uppercase tracking-wide flex flex-col items-center gap-2">
                <i class="fas fa-mars text-3xl"></i> Torneo Maschile
            </button>
            <button onclick="selectCategory('femminile')" class="w-full sm:w-64 bg-pink-600 hover:bg-pink-500 text-white font-bold py-6 px-8 rounded-2xl shadow-lg transition-all text-xl uppercase tracking-wide flex flex-col items-center gap-2">
                <i class="fas fa-venus text-3xl"></i> Torneo Femminile
            </button>
        </div>

        <!-- DASHBOARD TORNEO -->
        <div id="tournament-dashboard" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <button onclick="goBack()" class="text-gray-400 hover:text-white flex items-center gap-2 transition-colors">
                    <i class="fas fa-arrow-left"></i> Cambia Categoria
                </button>
                <button onclick="caricaDatiDalFoglio()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg border border-gray-700 flex items-center gap-1 transition-colors">
                    <i class="fas fa-sync-alt"></i> Aggiorna Dati
                </button>
            </div>

            <h2 id="dashboard-title" class="text-2xl font-bold border-b border-gray-700 pb-3 mb-6 uppercase tracking-wide"></h2>

            <div id="navigation-buttons" class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-8"></div>

            <div id="section-content" class="bg-gray-800 rounded-xl p-6 shadow-xl border border-gray-700 min-h-[300px]">
                <div class="text-center py-12 text-gray-400"><i class="fas fa-spinner animate-spin text-2xl mb-2"></i> Caricamento dati...</div>
            </div>
        </div>

    </main>

    <footer class="bg-gray-950 text-center py-4 text-xs text-gray-500 border-t border-gray-800">
        &copy; SPIN MOVE 2K26
    </footer>

    <script>
        const GOOGLE_SHEET_ID = '1YYP6YIkMWEwkhPOiU5EaYoGdMl86cuz0aaJ5VjqFlEA'; 

        let DATA_PARTITE = [];
        let currentCategory = '';
        let currentTab = 'calendario';

        const sectionsConfig = {
            maschile: [
                { id: 'calendario', label: 'Calendario', icon: 'fa-calendar-alt' },
                { id: 'risultati', label: 'Turni e Risultati', icon: 'fa-list-ol' },
                { id: 'classifica', label: 'Classifiche Gironi', icon: 'fa-trophy' },
                { id: 'king', label: 'King of the Court', icon: 'fa-medal' },
                { id: 'barilotto', label: 'Torneo Barilotto', icon: 'fa-beer' },
                { id: 'playoff', label: 'Playoff', icon: 'fa-crown' }
            ],
            femminile: [
                { id: 'calendario', label: 'Calendario', icon: 'fa-calendar-alt' },
                { id: 'risultati', label: 'Turni e Risultati', icon: 'fa-list-ol' },
                { id: 'classifica', label: 'Classifiche Gironi', icon: 'fa-trophy' },
                { id: 'king', label: 'King of the Court', icon: 'fa-medal' },
                { id: 'playoff', label: 'Playoff', icon: 'fa-crown' }
            ]
        };

        window.onload = caricaDatiDalFoglio;

        async function caricaDatiDalFoglio() {
            try {
                const contentContainer = document.getElementById('section-content');
                if(contentContainer && currentCategory) {
                    contentContainer.innerHTML = `<div class="text-center py-12 text-gray-400"><i class="fas fa-spinner animate-spin text-2xl mb-2"></i> Aggiornamento dati in corso...</div>`;
                }

                const urlMaschile = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Maschile`;
                const urlFemminile = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Femminile`;

                const [resM, resF] = await Promise.all([fetch(urlMaschile), fetch(urlFemminile)]);
                const textM = await resM.text();
                const textF = await resF.text();

                const datiMaschile = parseCSV(textM, 'maschile');
                const datiFemminile = parseCSV(textF, 'femminile');

                DATA_PARTITE = [...datiMaschile, ...datiFemminile];
                
                const savedCategory = localStorage.getItem('torneo_categoria');
                if (savedCategory) {
                    selectCategory(savedCategory, true);
                } else {
                    document.getElementById('category-selection').classList.remove('hidden');
                    document.getElementById('tournament-dashboard').classList.add('hidden');
                }
            } catch (error) {
                console.error("Errore caricamento dati:", error);
                const savedCategory = localStorage.getItem('torneo_categoria');
                if (savedCategory) {
                    document.getElementById('category-selection').classList.add('hidden');
                    document.getElementById('tournament-dashboard').classList.remove('hidden');
                    document.getElementById('section-content').innerHTML = `<p class="text-red-400 text-center py-8">Errore nel caricamento dei dati.<br>Verifica che il Foglio Google sia pubblicato sul web e che i fogli si chiamino "Maschile" e "Femminile".</p>`;
                } else {
                    document.getElementById('category-selection').classList.remove('hidden');
                }
            }
        }

        function parseCSV(text, categoria) {
            const lines = text.split('\n');
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;
                const cols = line.replace(/"/g, '').split(',');
                if (cols.length >= 8) {
                    data.push({
                        categoria: categoria,
                        girone: cols[0].trim(),
                        turno: cols[1].trim(),
                        data: cols[2].trim(),
                        casa: cols[3].trim(),
                        puntiCasa: parseInt(cols[4]) || 0,
                        puntiFuori: parseInt(cols[5]) || 0,
                        fuori: cols[6].trim(),
                        giocata: cols[7].toUpperCase().trim() === 'SI',
                        orario: cols[8] ? cols[8].trim() : '',
                        campo: cols[9] ? cols[9].trim() : ''
                    });
                }
            }
            return data;
        }

        function selectCategory(category, isRestoring = false) {
            currentCategory = category;
            localStorage.setItem('torneo_categoria', category);
            
            document.getElementById('category-selection').classList.add('hidden');
            document.getElementById('tournament-dashboard').classList.remove('hidden');
            
            const titleElement = document.getElementById('dashboard-title');
            titleElement.innerText = category === 'maschile' ? 'Torneo Maschile' : 'Torneo Femminile';
            titleElement.className = category === 'maschile' ? 'text-2xl font-bold border-b border-gray-700 pb-3 mb-6 text-orange-400' : 'text-2xl font-bold border-b border-gray-700 pb-3 mb-6 text-pink-500';

            renderButtons();
            
            if (isRestoring) {
                const savedTab = localStorage.getItem('torneo_tab') || 'calendario';
                const tabExists = sectionsConfig[category].some(sec => sec.id === savedTab);
                switchTab(tabExists ? savedTab : 'calendario');
            } else {
                switchTab('calendario');
            }
        }

        function goBack() {
            localStorage.removeItem('torneo_categoria');
            localStorage.removeItem('torneo_tab');
            currentCategory = '';
            document.getElementById('category-selection').classList.remove('hidden');
            document.getElementById('tournament-dashboard').classList.add('hidden');
        }

        function renderButtons() {
            const btnContainer = document.getElementById('navigation-buttons');
            const sections = sectionsConfig[currentCategory];
            btnContainer.className = `grid grid-cols-2 md:grid-cols-${sections.length} gap-3 mb-8`;
            btnContainer.innerHTML = '';

            sections.forEach(sec => {
                const button = document.createElement('button');
                button.id = `btn-${sec.id}`;
                button.onclick = () => switchTab(sec.id);
                button.className = `flex flex-col items-center justify-center p-3 rounded-xl font-semibold text-sm bg-gray-800 text-gray-300 border border-gray-700 hover:bg-gray-700`;
                button.innerHTML = `<i class="fas ${sec.icon} text-lg mb-1"></i> ${sec.label}`;
                btnContainer.appendChild(button);
            });
        }

        function switchTab(tabId) {
            currentTab = tabId;
            localStorage.setItem('torneo_tab', tabId);

            sectionsConfig[currentCategory].forEach(sec => {
                const btn = document.getElementById(`btn-${sec.id}`);
                if (btn) btn.className = `flex flex-col items-center justify-center p-3 rounded-xl font-semibold text-sm bg-gray-800 text-gray-300 border border-gray-700 hover:bg-gray-700`;
            });

            const activeBtn = document.getElementById(`btn-${tabId}`);
            if (activeBtn) {
                const colorClass = currentCategory === 'maschile' ? 'border-orange-500 bg-orange-600' : 'border-pink-500 bg-pink-600';
                activeBtn.className = `flex flex-col items-center justify-center p-3 rounded-xl font-bold text-sm border ${colorClass} text-white shadow-lg`;
            }
            renderContent(tabId);
        }

        function renderContent(tabId) {
            const container = document.getElementById('section-content');
            const filtrate = DATA_PARTITE.filter(p => p.categoria === currentCategory);

            if (tabId === 'calendario') {
                const daGiocare = filtrate.filter(p => !p.giocata && !p.turno.toLowerCase().includes('playoff') && !p.turno.toLowerCase().includes('barilotto') && !p.girone.toLowerCase().trim().includes('1v1'));
                stampaListaPartite(container, daGiocare, "Prossime Partite in Calendario", "fa-calendar-alt", "text-orange-400");
                
            } else if (tabId === 'risultati') {
                const giocate = filtrate.filter(p => p.giocata && !p.turno.toLowerCase().includes('playoff') && !p.turno.toLowerCase().includes('barilotto') && !p.girone.toLowerCase().trim().includes('1v1'));
                stampaListaRisultati(container, giocate, "Risultati Incontri", "fa-list-ol", "text-green-400");

            } else if (tabId === 'barilotto') {
                const matchBarilotto = filtrate.filter(p => p.turno.toLowerCase().includes('barilotto'));
                stampaSezioneBarilotto(container, matchBarilotto);

            } else if (tabId === 'playoff') {
                const matchPlayoff = filtrate.filter(p => p.turno.toLowerCase().includes('playoff'));
                stampaSezionePlayoff(container, matchPlayoff);

            } else if (tabId === 'classifica') {
                calcolaEMostraClassifica(container, filtrate);
                
            } else if (tabId === 'king') {
                const matchKing = filtrate.filter(p => p.girone.toLowerCase().trim().includes('1v1'));
                stampaSezioneKing(container, matchKing);
            }
        }

        function stampaListaPartite(container, lista, titolo, icona, coloreTesto) {
            if(lista.length === 0) { container.innerHTML = `<p class="text-gray-400 text-center py-8">Nessun match in questa sezione al momento.</p>`; return; }
            let html = `<h3 class="text-xl font-bold mb-4 ${coloreTesto}"><i class="fas ${icona} mr-2"></i>${titolo}</h3><div class="space-y-3">`;
            lista.forEach(p => {
                let infoAggiuntive = '';
                if (p.orario || p.campo) {
                    infoAggiuntive = `<div class="text-sm text-gray-350 mt-1.5 flex flex-wrap gap-x-4 justify-center sm:justify-start font-medium">`;
                    if (p.orario) infoAggiuntive += `<span><i class="far fa-clock text-orange-400 mr-1.5"></i>Ora: <b class="text-white">${p.orario}</b></span>`;
                    if (p.campo) infoAggiuntive += `<span><i class="fas fa-map-marker-alt text-orange-400 mr-1.5"></i>Campo: <b class="text-white">${p.campo}</b></span>`;
                    infoAggiuntive += `</div>`;
                }

                html += `<div class="bg-gray-700 p-3 sm:p-4 rounded-lg flex flex-col sm:flex-row justify-between items-center gap-3">
                            <div class="w-full sm:w-auto text-center sm:text-left">
                                <span class="text-xs bg-gray-900 border border-gray-600 px-2 py-1 rounded text-gray-300 font-mono inline-block"><b class="text-orange-400">${p.girone.toUpperCase()}</b> - ${p.turno} - ${p.data}</span>
                                ${infoAggiuntive}
                            </div>
                            <div class="flex items-center justify-center gap-2 sm:gap-4 text-base sm:text-xl w-full sm:w-auto">
                                <span class="text-right flex-1 sm:flex-none font-semibold truncate max-w-[140px] sm:max-w-none text-gray-100">${p.casa}</span>
                                <span class="text-orange-500 font-normal text-xs uppercase tracking-wider px-1 flex-shrink-0">vs</span>
                                <span class="text-left flex-1 sm:flex-none font-semibold truncate max-w-[140px] sm:max-w-none text-gray-100">${p.fuori}</span>
                            </div>
                         </div>`;
            });
            container.innerHTML = html + `</div>`;
        }

        function stampaListaRisultati(container, lista, titolo, icona, coloreTesto) {
            if(lista.length === 0) { container.innerHTML = `<p class="text-gray-400 text-center py-8">Nessun risultato disponibile.</p>`; return; }
            let html = `<h3 class="text-xl font-bold mb-4 ${coloreTesto}"><i class="fas ${icona} mr-2"></i>${titolo}</h3><div class="space-y-3">`;
            lista.forEach(p => {
                let infoAggiuntive = '';
                if (p.orario || p.campo) {
                    infoAggiuntive = `<div class="text-sm text-gray-400 mt-1.5 flex flex-wrap gap-x-4 justify-center sm:justify-start">`;
                    if (p.orario) infoAggiuntive += `<span><i class="far fa-clock mr-1.5"></i>Ora: <b class="text-gray-200">${p.orario}</b></span>`;
                    if (p.campo) infoAggiuntive += `<span><i class="fas fa-map-marker-alt mr-1.5"></i>Campo: <b class="text-gray-200">${p.campo}</b></span>`;
                    infoAggiuntive += `</div>`;
                }

                html += `<div class="bg-gray-700 p-3 sm:p-4 rounded-lg flex flex-col sm:flex-row justify-between items-center gap-3">
                            <div class="w-full sm:w-auto text-center sm:text-left">
                                <span class="text-xs bg-gray-900 border border-gray-600 px-2 py-1 rounded text-gray-300 font-mono inline-block"><b class="text-green-400">${p.girone.toUpperCase()}</b> - ${p.turno}</span>
                                ${infoAggiuntive}
                            </div>
                            <div class="flex items-center justify-center gap-2 sm:gap-4 text-base sm:text-xl w-full sm:w-auto">
                                <span class="text-right flex-1 sm:flex-none truncate max-w-[140px] sm:max-w-none ${p.puntiCasa > p.puntiFuori ? 'font-bold text-white': 'text-gray-400'}">${p.casa}</span>
                                <span class="bg-gray-900 px-2.5 py-1 rounded font-mono font-bold text-yellow-400 text-sm sm:text-base whitespace-nowrap flex-shrink-0 shadow-inner">${p.puntiCasa} - ${p.puntiFuori}</span>
                                <span class="text-left flex-1 sm:flex-none truncate max-w-[140px] sm:max-w-none ${p.puntiFuori > p.puntiCasa ? 'font-bold text-white': 'text-gray-400'}">${p.fuori}</span>
                            </div>
                         </div>`;
            });
            container.innerHTML = html + `</div>`;
        }

        function calcolaEMostraClassifica(container, tutteLePartite) {
            let gironi = {};
            
            tutteLePartite.forEach(p => {
                if (!p.turno.toLowerCase().includes('playoff') && !p.turno.toLowerCase().includes('barilotto') && !p.girone.toLowerCase().trim().includes('1v1')) {
                    const gNome = p.girone.toUpperCase() || 'GENERALE';
                    if (!gironi[gNome]) gironi[gNome] = {};
                    if (!gironi[gNome][p.casa]) gironi[gNome][p.casa] = { nome: p.casa, vinte: 0, perse: 0, punti: 0, fatti: 0, subiti: 0 };
                    if (!gironi[gNome][p.fuori]) gironi[gNome][p.fuori] = { nome: p.fuori, vinte: 0, perse: 0, punti: 0, fatti: 0, subiti: 0 };
                }
            });

            tutteLePartite.forEach(p => {
                if (p.giocata && !p.turno.toLowerCase().includes('playoff') && !p.turno.toLowerCase().includes('barilotto') && !p.girone.toLowerCase().trim().includes('1v1')) {
                    const gNome = p.girone.toUpperCase() || 'GENERALE';
                    if(gironi[gNome] && gironi[gNome][p.casa] && gironi[gNome][p.fuori]) {
                        gironi[gNome][p.casa].fatti += p.puntiCasa;
                        gironi[gNome][p.casa].subiti += p.puntiFuori;
                        gironi[gNome][p.fuori].fatti += p.puntiFuori;
                        gironi[gNome][p.fuori].subiti += p.puntiCasa;

                        if (p.puntiCasa > p.puntiFuori) {
                            gironi[gNome][p.casa].vinte += 1;
                            gironi[gNome][p.casa].punti += 2;
                            gironi[gNome][p.fuori].perse += 1;
                        } else {
                            gironi[gNome][p.fuori].vinte += 1;
                            gironi[gNome][p.fuori].punti += 2;
                            gironi[gNome][p.casa].perse += 1;
                        }
                    }
                }
            });

            let html = `<h3 class="text-xl font-bold mb-6 text-yellow-500"><i class="fas fa-trophy mr-2"></i>Classifiche dei Gironi</h3>`;
            const gironiOrdinati = Object.keys(gironi).sort();
            
            if (gironiOrdinati.length === 0) { 
                container.innerHTML = `<p class="text-gray-400 text-center py-8">Inserisci le partite nel foglio per generare le classifiche.</p>`; 
                return; 
            }

            gironiOrdinati.forEach(gNome => {
                let ordinata = Object.values(gironi[gNome]).sort((a, b) => {
                    if (b.punti !== a.punti) return b.punti - a.punti;
                    return (b.fatti - b.subiti) - (a.fatti - a.subiti);
                });

                const colorGirone = currentCategory === 'maschile' ? 'text-orange-400' : 'text-pink-500';

                html += `<div class="mb-8 bg-gray-850 p-4 rounded-xl border border-gray-700 shadow-lg">
                            <h4 class="text-lg font-bold mb-3 ${colorGirone} border-b border-gray-700 pb-1 uppercase tracking-wider">${gNome}</h4>
                            <div class="overflow-x-auto"><table class="w-full text-left border-collapse">
                            <thead><tr class="border-b border-gray-800 text-gray-400 text-xs uppercase">
                                <th class="py-2 px-2 w-12">Pos</th><th class="py-2">Squadra</th>
                                <th class="py-2 text-center w-16">Punti</th><th class="py-2 text-center w-12">V</th><th class="py-2 text-center w-12">P</th>
                                <th class="py-2 text-center w-16 hidden sm:table-cell">Diff</th>
                            </tr></thead><tbody>`;
                
                ordinata.forEach((sq, index) => {
                    const diff = sq.fatti - sq.subiti;
                    html += `<tr class="border-b border-gray-800 hover:bg-gray-750 transition-colors">
                                <td class="py-2.5 px-2 font-bold text-gray-500">${index + 1}</td>
                                <td class="py-2.5 font-semibold text-base text-gray-200">${sq.nome}</td>
                                <td class="py-2.5 text-center font-bold text-green-400 text-base">${sq.punti}</td>
                                <td class="py-2.5 text-center text-sm">${sq.vinte}</td>
                                <td class="py-2.5 text-center text-sm">${sq.perse}</td>
                                <td class="py-2.5 text-center text-xs text-gray-400 hidden sm:table-cell font-mono">${diff > 0 ? '+' + diff : diff}</td>
                             </tr>`;
                });
                html += `</tbody></table></div></div>`;
            });

            container.innerHTML = html;
        }

        function stampaSezioneKing(container, lista) {
            let matchValiviRaw = lista.filter(p => p.turno && p.turno.trim() !== "");
            let matchValidi = matchValiviRaw.filter(p => p.casa.trim() !== "" || p.fuori.trim() !== "" || p.giocata);

            if(matchValidi.length === 0) { 
                container.innerHTML = `<h3 class="text-xl font-bold mb-4 text-purple-400"><i class="fas fa-medal mr-2"></i>King of the Court 1v1</h3><p class="text-gray-400 text-center py-8">In attesa dell'inserimento delle sfide 1v1 nel foglio.</p>`; 
                return; 
            }

            let turniOrdinati = [];
            matchValidi.forEach(p => {
                if (!turniOrdinati.includes(p.turno)) turniOrdinati.push(p.turno);
            });

            let colonneTabellone = [];
            
            function getVincitore(match) {
                if (!match || !match.giocata) return "Da definire";
                return match.puntiCasa > match.puntiFuori ? match.casa : match.fuori;
            }

            for (let tIdx = 0; tIdx < turniOrdinati.length; tIdx++) {
                let nomeTurnoCorrente = turniOrdinati[tIdx];
                let matchFoglio = matchValidi.filter(p => p.turno === nomeTurnoCorrente);
                let matchDellaColonna = [];
                
                if (tIdx === 0) {
                    matchDellaColonna = matchFoglio.map(p => ({
                        casa: p.casa || "Da definire",
                        fuori: p.fuori || "Da definire",
                        puntiCasa: p.puntiCasa,
                        puntiFuori: p.puntiFuori,
                        giocata: p.giocata,
                        data: p.data,
                        orario: p.orario,
                        campo: p.campo
                    }));
                } else {
                    let colonnaPrecedente = colonneTabellone[tIdx - 1];
                    let nrMatchAttesi = Math.ceil(colonnaPrecedente.match.length / 2);
                    
                    for (let i = 0; i < nrMatchAttesi; i++) {
                        let m1 = colonnaPrecedente.match[i * 2];
                        let m2 = colonnaPrecedente.match[i * 2 + 1];
                        
                        let autoCasa = m1 ? getVincitore(m1) : "Da definire";
                        let autoFuori = m2 ? getVincitore(m2) : "Da definire";
                        
                        let p = matchFoglio[i];
                        
                        if (p) {
                            matchDellaColonna.push({
                                casa: (p.casa && p.casa.trim() !== "" && p.casa !== "Da definire") ? p.casa : autoCasa,
                                fuori: (p.fuori && p.fuori.trim() !== "" && p.fuori !== "Da definire") ? p.fuori : autoFuori,
                                puntiCasa: p.puntiCasa,
                                puntiFuori: p.puntiFuori,
                                giocata: p.giocata,
                                data: p.data,
                                orario: p.orario,
                                campo: p.campo
                            });
                        } else {
                            matchDellaColonna.push({
                                casa: autoCasa,
                                fuori: autoFuori,
                                puntiCasa: 0,
                                puntiFuori: 0,
                                giocata: false,
                                data: "",
                                orario: "",
                                campo: ""
                            });
                        }
                    }
                }
                
                colonneTabellone.push({
                    nome: nomeTurnoCorrente,
                    match: matchDellaColonna
                });
            }

            let html = `<div class="mb-4">
                            <h3 class="text-xl font-bold text-purple-400 flex items-center gap-2"><i class="fas fa-medal"></i> King of the Court 1v1</h3>
                        </div>`;
            
            html += `<div class="flex flex-col md:flex-row gap-6 md:overflow-x-auto pb-4 pt-2 items-stretch min-h-[600px]">`;
            
            colonneTabellone.forEach(col => {
                html += `<div class="flex-1 min-w-[240px] bg-gray-850 p-4 rounded-xl border border-gray-700 flex flex-col">
                            <h4 class="text-xs font-extrabold text-purple-400 uppercase tracking-wider text-center border-b border-gray-700 pb-2 mb-4 font-mono">${col.nome}</h4>
                            <div class="flex flex-col justify-around flex-grow gap-4">`;
                
                col.match.forEach(m => {
                    const casaVincente = m.giocata && m.puntiCasa > m.puntiFuori;
                    const fuoriVincente = m.giocata && m.puntiFuori > m.puntiCasa;
                    
                    let infoKing = [];
                    if (m.data && m.data !== "Da definire" && m.data.trim() !== "") infoKing.push(m.data);
                    if (m.orario && m.orario.trim() !== "") infoKing.push(`<i class="far fa-clock text-purple-400"></i> <b>${m.orario}</b>`);
                    if (m.campo && m.campo.trim() !== "") infoKing.push(`<i class="fas fa-map-marker-alt text-purple-400"></i> <b>${m.campo}</b>`);
                    
                    let footerHTML = '';
                    if (!m.giocata && infoKing.length > 0) {
                        footerHTML = `<div class="bg-gray-750 text-xs text-gray-300 text-center py-1.5 border-t border-gray-600/30 font-mono flex flex-wrap justify-center gap-x-2 px-1">
                                        ${infoKing.join(' • ')}
                                      </div>`;
                    }
                    
                    html += `<div class="bg-gray-700 rounded-lg border border-gray-600 overflow-hidden shadow-lg border-l-4 ${m.giocata ? 'border-l-purple-500' : 'border-l-gray-500'}">
                                <div class="flex justify-between items-center px-3 py-2.5 border-b border-gray-600/50 ${casaVincente ? 'bg-purple-600/10' : ''}">
                                    <span class="truncate text-base ${m.giocata ? (casaVincente ? 'font-bold text-purple-300' : 'text-gray-500 line-through') : (m.casa === 'Da definire' ? 'text-gray-500 italic' : 'text-gray-100 font-semibold')}">
                                        ${casaVincente ? '👑 ' : ''}${m.casa}
                                    </span>
                                    ${m.giocata ? `<span class="font-mono font-bold text-base ${casaVincente ? 'text-yellow-400' : 'text-gray-400'}">${m.puntiCasa}</span>` : ''}
                                </div>
                                <div class="flex justify-between items-center px-3 py-2.5 ${fuoriVincente ? 'bg-purple-600/10' : ''}">
                                    <span class="truncate text-base ${m.giocata ? (fuoriVincente ? 'font-bold text-purple-300' : 'text-gray-500 line-through') : (m.fuori === 'Da definire' ? 'text-gray-500 italic' : 'text-gray-100 font-semibold')}">
                                        ${fuoriVincente ? '👑 ' : ''}${m.fuori}
                                    </span>
                                    ${m.giocata ? `<span class="font-mono font-bold text-base ${fuoriVincente ? 'text-yellow-400' : 'text-gray-400'}">${m.puntiFuori}</span>` : ''}
                                </div>
                                ${footerHTML}
                             </div>`;
                });
                
                html += `   </div>
                         </div>`;
            });
            
            html += `</div>`;
            container.innerHTML = html;
        }

        function stampaSezionePlayoff(container, lista) {
            let matchValidi = lista.filter(p => p.turno && p.turno.trim() !== "");

            if(matchValidi.length === 0) { 
                container.innerHTML = `<h3 class="text-xl font-bold mb-4 text-yellow-500"><i class="fas fa-crown mr-2"></i>Fase Playoff</h3><p class="text-gray-400 text-center py-8">In attesa dell'inserimento dei match di playoff nel foglio.</p>`; 
                return; 
            }

            let quarti = matchValidi.filter(p => p.turno.toLowerCase().includes('quarti'));
            let semifinali = matchValidi.filter(p => p.turno.toLowerCase().includes('semifinale') || p.turno.toLowerCase().includes('semi'));
            let finale = matchValidi.filter(p => p.turno.toLowerCase().includes('finale') && !p.turno.toLowerCase().includes('semi'));

            let colonne = [];
            if (quarti.length > 0) colonne.push({ nome: "Quarti di Finale", match: quarti, tipo: "quarti" });
            if (semifinali.length > 0) colonne.push({ nome: "Semifinali", match: semifinali, tipo: "semifinali" });
            if (finale.length > 0) colonne.push({ nome: "Finale", match: finale, tipo: "finale" });

            let html = `<div class="mb-4">
                            <h3 class="text-xl font-bold text-yellow-500 flex items-center gap-2"><i class="fas fa-crown"></i> Playoff</h3>
                        </div>`;
            
            html += `<div class="flex flex-col md:flex-row gap-6 items-stretch pb-4 pt-2">`;

            colonne.forEach(col => {
                const colorTitle = currentCategory === 'maschile' ? 'text-orange-400' : 'text-pink-500';
                html += `<div class="flex-1 min-w-[250px] bg-gray-850 p-4 rounded-xl border border-gray-700 flex flex-col">
                            <h4 class="text-sm font-extrabold ${colorTitle} uppercase tracking-wider text-center border-b border-gray-700 pb-2 mb-4 font-mono">${col.nome}</h4>
                            <div class="flex flex-col justify-around flex-grow gap-4">`;

                col.match.forEach((m, idx) => {
                    let segnapostoCasa = "Da definire";
                    let segnapostoFuori = "Da definire";

                    if (col.tipo === "quarti") {
                        if (idx === 0) { segnapostoCasa = "1° Girone A"; segnapostoFuori = "2° Girone B"; }
                        if (idx === 1) { segnapostoCasa = "1° Girone C"; segnapostoFuori = "2° Girone D"; }
                        if (idx === 2) { segnapostoCasa = "1° Girone B"; segnapostoFuori = "2° Girone A"; }
                        if (idx === 3) { segnapostoCasa = "1° Girone D"; segnapostoFuori = "2° Girone C"; }
                    } else if (col.tipo === "semifinali") {
                        if (quarti.length > 0) {
                            if (idx === 0) { segnapostoCasa = "Vinc. Quarti 1"; segnapostoFuori = "Vinc. Quarti 2"; }
                            if (idx === 1) { segnapostoCasa = "Vinc. Quarti 3"; segnapostoFuori = "Vinc. Quarti 4"; }
                        } else {
                            if (idx === 0) { segnapostoCasa = "1° Girone A"; segnapostoFuori = "2° Girone B"; }
                            if (idx === 1) { segnapostoCasa = "1° Girone B"; segnapostoFuori = "2° Girone A"; }
                        }
                    } else if (col.tipo === "finale") {
                        segnapostoCasa = "Vinc. Semi 1";
                        segnapostoFuori = "Vinc. Semi 2";
                    }

                    const nomeCasa = m.casa && m.casa.trim() !== "" ? m.casa : segnapostoCasa;
                    const nomeFuori = m.fuori && m.fuori.trim() !== "" ? m.fuori : segnapostoFuori;

                    const casaVincente = m.giocata && m.puntiCasa > m.puntiFuori;
                    const fuoriVincente = m.giocata && m.puntiFuori > m.puntiCasa;

                    let infoMatch = [];
                    if (m.data && m.data.trim() !== "") infoMatch.push(m.data);
                    if (m.orario && m.orario.trim() !== "") infoMatch.push(`<i class="far fa-clock text-yellow-500"></i> <b>${m.orario}</b>`);
                    if (m.campo && m.campo.trim() !== "") infoMatch.push(`<i class="fas fa-map-marker-alt text-yellow-500"></i> <b>${m.campo}</b>`);

                    let footerHTML = '';
                    if (!m.giocata && infoMatch.length > 0) {
                        footerHTML = `<div class="bg-gray-750 text-xs text-gray-300 text-center py-1.5 border-t border-gray-600/30 font-mono flex flex-wrap justify-center gap-x-2 px-1">
                                        ${infoMatch.join(' • ')}
                                      </div>`;
                    }

                    html += `<div class="bg-gray-700 rounded-lg border border-gray-600 overflow-hidden shadow-lg border-l-4 ${m.giocata ? 'border-l-yellow-500' : 'border-l-gray-500'}">
                                <div class="flex justify-between items-center px-3 py-2.5 border-b border-gray-600/50 ${casaVincente ? 'bg-yellow-600/10' : ''}">
                                    <span class="truncate text-base ${m.giocata ? (casaVincente ? 'font-bold text-yellow-300' : 'text-gray-500 line-through') : (m.casa && m.casa.trim() !== "" ? 'text-gray-100 font-semibold' : 'text-gray-400 italic text-sm')}">
                                        ${casaVincente ? '👑 ' : ''}${nomeCasa}
                                    </span>
                                    ${m.giocata ? `<span class="font-mono font-bold text-base ${casaVincente ? 'text-yellow-400' : 'text-gray-400'}">${m.puntiCasa}</span>` : ''}
                                </div>
                                <div class="flex justify-between items-center px-3 py-2.5 ${fuoriVincente ? 'bg-yellow-600/10' : ''}">
                                    <span class="truncate text-base ${m.giocata ? (fuoriVincente ? 'font-bold text-yellow-300' : 'text-gray-500 line-through') : (m.fuori && m.fuori.trim() !== "" ? 'text-gray-100 font-semibold' : 'text-gray-400 italic text-sm')}">
                                        ${fuoriVincente ? '👑 ' : ''}${nomeFuori}
                                    </span>
                                    ${m.giocata ? `<span class="font-mono font-bold text-base ${fuoriVincente ? 'text-yellow-400' : 'text-gray-400'}">${m.puntiFuori}</span>` : ''}
                                </div>
                                ${footerHTML}
                             </div>`;
                });

                html += `   </div>
                         </div>`;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function stampaSezioneBarilotto(container, lista) {
            let matchValidi = lista.filter(p => p.turno && p.turno.trim() !== "");

            if(matchValidi.length === 0) { 
                container.innerHTML = `<h3 class="text-xl font-bold mb-4 text-amber-500"><i class="fas fa-beer mr-2"></i>Torneo Barilotto</h3><p class="text-gray-400 text-center py-8">In attesa dell'inserimento dei match del Torneo Barilotto nel foglio.</p>`; 
                return; 
            }

            let preliminari = matchValidi.filter(p => p.turno.toLowerCase().includes('preliminar') || p.turno.toLowerCase().includes('primo turno'));
            let quarti = matchValidi.filter(p => p.turno.toLowerCase().includes('quarti'));
            let semifinali = matchValidi.filter(p => p.turno.toLowerCase().includes('semifinale') || p.turno.toLowerCase().includes('semi'));
            let finale = matchValidi.filter(p => p.turno.toLowerCase().includes('finale') && !p.turno.toLowerCase().includes('semi'));

            let colonne = [];
            if (preliminari.length > 0) colonne.push({ nome: "Turno Preliminare", match: preliminari, tipo: "preliminari" });
            if (quarti.length > 0) colonne.push({ nome: "Quarti Barilotto", match: quarti, tipo: "quarti" });
            if (semifinali.length > 0) colonne.push({ nome: "Semifinali Barilotto", match: semifinali, tipo: "semifinali" });
            if (finale.length > 0) colonne.push({ nome: "Finale Barilotto", match: finale, tipo: "finale" });

            let html = `<div class="mb-4">
                            <h3 class="text-xl font-bold text-amber-500 flex items-center gap-2"><i class="fas fa-beer"></i> Torneo Barilotto</h3>
                        </div>`;
            
            html += `<div class="flex flex-col md:flex-row gap-6 items-stretch pb-4 pt-2 md:overflow-x-auto">`;

            colonne.forEach(col => {
                html += `<div class="flex-1 min-w-[250px] bg-gray-850 p-4 rounded-xl border border-gray-700 flex flex-col">
                            <h4 class="text-sm font-extrabold text-amber-500 uppercase tracking-wider text-center border-b border-gray-700 pb-2 mb-4 font-mono">${col.nome}</h4>
                            <div class="flex flex-col justify-around flex-grow gap-4">`;

                col.match.forEach((m, idx) => {
                    let segnapostoCasa = "Da definire";
                    let segnapostoFuori = "Da definire";

                    if (col.tipo === "preliminari") {
                        if (idx === 0) { segnapostoCasa = "3° Girone A"; segnapostoFuori = "4° Girone B"; }
                        if (idx === 1) { segnapostoCasa = "3° Girone C"; segnapostoFuori = "4° Girone D"; }
                        if (idx === 2) { segnapostoCasa = "3° Girone B"; segnapostoFuori = "4° Girone A"; }
                        if (idx === 3) { segnapostoCasa = "3° Girone D"; segnapostoFuori = "4° Girone C"; }
                    } else if (col.tipo === "quarti") {
                        if (preliminari.length > 0) {
                            segnapostoCasa = `Vinc. Preliminare ${idx + 1}`;
                            segnapostoFuori = `Perd. Quarti Playoff ${idx + 1}`;
                        } else {
                            segnapostoCasa = "Da definire";
                            segnapostoFuori = "Da definire";
                        }
                    } else if (col.tipo === "semifinali") {
                        segnapostoCasa = `Vinc. Quarti Barilotto ${idx * 2 + 1}`;
                        segnapostoFuori = `Vinc. Quarti Barilotto ${idx * 2 + 2}`;
                    } else if (col.tipo === "finale") {
                        segnapostoCasa = "Vinc. Semi Barilotto 1";
                        segnapostoFuori = "Vinc. Semi Barilotto 2";
                    }

                    const nomeCasa = m.casa && m.casa.trim() !== "" ? m.casa : segnapostoCasa;
                    const nomeFuori = m.fuori && m.fuori.trim() !== "" ? m.fuori : segnapostoFuori;

                    const casaVincente = m.giocata && m.puntiCasa > m.puntiFuori;
                    const fuoriVincente = m.giocata && m.puntiFuori > m.puntiCasa;

                    let infoMatch = [];
                    if (m.data && m.data.trim() !== "") infoMatch.push(m.data);
                    if (m.orario && m.orario.trim() !== "") infoMatch.push(`<i class="far fa-clock text-amber-500"></i> <b>${m.orario}</b>`);
                    if (m.campo && m.campo.trim() !== "") infoMatch.push(`<i class="fas fa-map-marker-alt text-amber-500"></i> <b>${m.campo}</b>`);

                    let footerHTML = '';
                    if (!m.giocata && infoMatch.length > 0) {
                        footerHTML = `<div class="bg-gray-750 text-xs text-gray-300 text-center py-1.5 border-t border-gray-600/30 font-mono flex flex-wrap justify-center gap-x-2 px-1">
                                        ${infoMatch.join(' • ')}
                                      </div>`;
                    }

                    html += `<div class="bg-gray-700 rounded-lg border border-gray-600 overflow-hidden shadow-lg border-l-4 ${m.giocata ? 'border-l-amber-500' : 'border-l-gray-500'}">
                                <div class="flex justify-between items-center px-3 py-2.5 border-b border-gray-600/50 ${casaVincente ? 'bg-amber-600/10' : ''}">
                                    <span class="truncate text-base ${m.giocata ? (casaVincente ? 'font-bold text-amber-300' : 'text-gray-500 line-through') : (m.casa && m.casa.trim() !== "" ? 'text-gray-100 font-semibold' : 'text-gray-400 italic text-sm')}">
                                        ${casaVincente ? '👑 ' : ''}${nomeCasa}
                                    </span>
                                    ${m.giocata ? `<span class="font-mono font-bold text-base ${casaVincente ? 'text-yellow-400' : 'text-gray-400'}">${m.puntiCasa}</span>` : ''}
                                </div>
                                <div class="flex justify-between items-center px-3 py-2.5 ${fuoriVincente ? 'bg-amber-600/10' : ''}">
                                    <span class="truncate text-base ${m.giocata ? (fuoriVincente ? 'font-bold text-amber-300' : 'text-gray-500 line-through') : (m.fuori && m.fuori.trim() !== "" ? 'text-gray-100 font-semibold' : 'text-gray-400 italic text-sm')}">
                                        ${fuoriVincente ? '👑 ' : ''}${nomeFuori}
                                    </span>
                                    ${m.giocata ? `<span class="font-mono font-bold text-base ${fuoriVincente ? 'text-yellow-400' : 'text-gray-400'}">${m.puntiFuori}</span>` : ''}
                                </div>
                                ${footerHTML}
                             </div>`;
                });

                html += `   </div>
                         </div>`;
            });

            html += `</div>`;
            container.innerHTML = html;
        }
    </script>
</body>
