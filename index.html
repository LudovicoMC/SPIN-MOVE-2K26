<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIN MOVE 2K26</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">

    <style>
        .match-teams-container, 
        .partita-squadre-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            width: 100%;
            overflow: hidden;
        }

        .team-name, 
        .squadra-casa, 
        .squadra-fuori {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        @media (max-width: 768px) {
            .bracket-container {
                flex-direction: column !important;
                gap: 16px !important;
                overflow-x: visible !important;
            }
            .bracket-column {
                min-width: 100% !important;
                width: 100% !important;
            }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col">

    <!-- HEADER BRANDING -->
    <header class="bg-[#EB6B0E] shadow-md py-2 px-4 overflow-hidden">
        <div class="max-w-7xl mx-auto flex items-center justify-center relative">
            <img src="logo.png" alt="Spin Move Logo" class="h-[90px] md:h-28 w-auto object-contain -mr-3 md:-mr-5 z-10 drop-shadow-md pointer-events-none translate-y-1.5">
            
            <h1 class="text-3xl md:text-5xl uppercase tracking-wider text-white whitespace-nowrap z-0 leading-none drop-shadow-md" style="font-family: 'Permanent Marker', cursive;">
                SPIN MOVE 2K26
            </h1>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-2 sm:px-4 py-6 max-w-5xl">
        
        <!-- SELEZIONE CATEGORIA E CONTEST -->
        <div id="category-selection" class="flex flex-col items-center gap-6 my-8">
            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center w-full max-w-2xl">
                <button onclick="selectCategory('maschile')" class="w-full sm:w-1/2 bg-blue-700 hover:bg-blue-600 text-white font-bold py-6 px-8 rounded-2xl shadow-lg transition-all text-xl uppercase tracking-wide flex flex-col items-center gap-2">
                    <i class="fas fa-mars text-3xl"></i> Torneo Maschile
                </button>
                <button onclick="selectCategory('femminile')" class="w-full sm:w-1/2 bg-pink-600 hover:bg-pink-500 text-white font-bold py-6 px-8 rounded-2xl shadow-lg transition-all text-xl uppercase tracking-wide flex flex-col items-center gap-2">
                    <i class="fas fa-venus text-3xl"></i> Torneo Femminile
                </button>
            </div>
            
            <button onclick="selectCategory('threepoint')" class="w-full max-w-2xl bg-amber-600 hover:bg-amber-500 text-white font-bold py-5 px-8 rounded-2xl shadow-lg transition-all text-xl uppercase tracking-wide flex items-center justify-center gap-3 border-2 border-amber-400/30">
                <i class="fas fa-bullseye text-3xl"></i> 3 Point Contest
            </button>
        </div>

        <!-- DASHBOARD TORNEO / CONTEST -->
        <div id="tournament-dashboard" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <button onclick="goBack()" class="text-gray-400 hover:text-white flex items-center gap-2 transition-colors">
                    <i class="fas fa-arrow-left"></i> Torna alla Home
                </button>
                <button onclick="caricaDatiDalFoglio()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg border border-gray-700 flex items-center gap-1 transition-colors">
                    <i class="fas fa-sync-alt"></i> Aggiorna Dati
                </button>
            </div>

            <h2 id="dashboard-title" class="text-2xl font-bold border-b border-gray-700 pb-3 mb-6 uppercase tracking-wide"></h2>

            <div id="navigation-buttons" class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-8"></div>

            <div id="section-content" class="bg-gray-800 rounded-xl p-2 sm:p-6 shadow-xl border border-gray-700 min-h-[300px]">
                <div class="text-center py-12 text-gray-400"><i class="fas fa-spinner animate-spin text-2xl mb-2"></i> Caricamento dati...</div>
            </div>
        </div>

    </main>

    <footer class="bg-gray-950 text-center py-4 text-xs text-gray-500 border-t border-gray-800">
        &copy; SPIN MOVE 2K26
    </footer>

    <script>
        const GOOGLE_SHEET_ID = '1YYP6YIkMWEwkhPOiU5EaYoGdMl86cuz0aaJ5VjqFlEA'; 

        let DATA_PARTITE = [];
        let INFO_KING = { maschile: '', femminile: '' };
        let INFO_3PT = { maschile: '', femminile: '' };
        let currentCategory = '';
        let currentTab = 'calendario';
        let filtroGironeAttivo = 'tutti';
        let filtro3PointSesso = 'maschile';

        const sectionsConfig = {
            maschile: [
                { id: 'calendario', label: 'Calendario', icon: 'fa-calendar-alt' },
                { id: 'risultati', label: 'Turni e Risultati', icon: 'fa-list-ol' },
                { id: 'classifica', label: 'Classifiche Gironi', icon: 'fa-trophy' },
                { id: 'king', label: 'King of the Court', icon: 'fa-medal' },
                { id: 'barilotto', label: 'Torneo Barilotto', icon: 'fa-beer' },
                { id: 'playoff', label: 'Playoff', icon: 'fa-crown' }
            ],
            femminile: [
                { id: 'calendario', label: 'Calendario', icon: 'fa-calendar-alt' },
                { id: 'risultati', label: 'Turni e Risultati', icon: 'fa-list-ol' },
                { id: 'classifica', label: 'Classifiche Gironi', icon: 'fa-trophy' },
                { id: 'king', label: 'Queen of the Court', icon: 'fa-medal' },
                { id: 'playoff', label: 'Playoff', icon: 'fa-crown' }
            ],
            threepoint: [
                { id: '3point_leaderboard', label: 'Qualificazioni', icon: 'fa-list-ol' },
                { id: '3point_bracket', label: 'Fase Finale', icon: 'fa-sitemap' }
            ]
        };

        window.onload = caricaDatiDalFoglio;

        async function caricaDatiDalFoglio() {
            try {
                const contentContainer = document.getElementById('section-content');
                if(contentContainer && currentCategory) {
                    contentContainer.innerHTML = `<div class="text-center py-12 text-gray-400"><i class="fas fa-spinner animate-spin text-2xl mb-2"></i> Aggiornamento dati in corso...</div>`;
                }

                const urlMaschile = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Maschile`;
                const urlFemminile = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Femminile`;

                const [resM, resF] = await Promise.all([fetch(urlMaschile), fetch(urlFemminile)]);
                const textM = await resM.text();
                const textF = await resF.text();

                const parsedM = parseCSV(textM, 'maschile');
                const parsedF = parseCSV(textF, 'femminile');

                DATA_PARTITE = [...parsedM.data, ...parsedF.data];
                INFO_KING.maschile = parsedM.infoKing;
                INFO_KING.femminile = parsedF.infoKing;

                INFO_3PT.maschile = parsedM.info3pt;
                INFO_3PT.femminile = parsedF.info3pt;
                
                const savedCategory = localStorage.getItem('torneo_categoria');
                if (savedCategory) {
                    selectCategory(savedCategory, true);
                } else {
                    document.getElementById('category-selection').classList.remove('hidden');
                    document.getElementById('tournament-dashboard').classList.add('hidden');
                }
            } catch (error) {
                console.error("Errore caricamento dati:", error);
                const savedCategory = localStorage.getItem('torneo_categoria');
                if (savedCategory) {
                    document.getElementById('category-selection').classList.add('hidden');
                    document.getElementById('tournament-dashboard').classList.remove('hidden');
                    document.getElementById('section-content').innerHTML = `<p class="text-red-400 text-center py-8">Errore nel caricamento dei dati.<br>Verifica che il Foglio Google sia pubblicato sul web.</p>`;
                } else {
                    document.getElementById('category-selection').classList.remove('hidden');
                }
            }
        }

        function parseCSV(text, categoria) {
            const lines = text.split('\n');
            const data = [];
            let infoKingText = '';
            let info3ptText = '';

            const rigaTargetIndex = 1; 
            const colonnaTargetIndex = categoria === 'maschile' ? 11 : 15; // L2 (index 11) o P2 (index 15)
            const colonnaTarget3ptIndex = categoria === 'maschile' ? 13 : 17; // N2 (index 13) o R2 (index 17)

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;
                
                const cols = line.split(',').map(c => c.replace(/^"|"$/g, '').trim());

                if (i === rigaTargetIndex) {
                    if (cols.length > colonnaTargetIndex) infoKingText = cols[colonnaTargetIndex];
                    if (cols.length > colonnaTarget3ptIndex) info3ptText = cols[colonnaTarget3ptIndex];
                }

                if (i > 0 && cols.length >= 8) {
                    data.push({
                        categoria: categoria,
                        girone: cols[0].trim(),
                        turno: cols[1].trim(),
                        data: cols[2].trim(),
                        casa: cols[3].trim(),
                        puntiCasa: parseInt(cols[4]) || 0,
                        puntiFuori: parseInt(cols[5]) || 0,
                        fuori: cols[6].trim(),
                        giocata: cols[7].toUpperCase().trim() === 'SI',
                        orario: cols[8] ? cols[8].trim() : '',
                        campo: cols[9] ? cols[9].trim() : ''
                    });
                }
            }
            return { data, infoKing: infoKingText, info3pt: info3ptText };
        }

        function selectCategory(category, isRestoring = false) {
            currentCategory = category;
            localStorage.setItem('torneo_categoria', category);
            
            document.getElementById('category-selection').classList.add('hidden');
            document.getElementById('tournament-dashboard').classList.remove('hidden');
            
            const titleElement = document.getElementById('dashboard-title');
            if(category === 'maschile') {
                titleElement.innerText = 'Torneo Maschile';
                titleElement.className = 'text-2xl font-bold border-b border-gray-700 pb-3 mb-6 text-sky-400';
            } else if(category === 'femminile') {
                titleElement.innerText = 'Torneo Femminile';
                titleElement.className = 'text-2xl font-bold border-b border-gray-700 pb-3 mb-6 text-pink-500';
            } else {
                titleElement.innerText = '3 Point Contest';
                titleElement.className = 'text-2xl font-bold border-b border-gray-700 pb-3 mb-6 text-amber-500';
            }

            renderButtons();
            
            if (isRestoring) {
                const savedTab = localStorage.getItem('torneo_tab') || (category === 'threepoint' ? '3point_leaderboard' : 'calendario');
                const tabExists = sectionsConfig[category].some(sec => sec.id === savedTab);
                switchTab(tabExists ? savedTab : sectionsConfig[category][0].id);
            } else {
                switchTab(sectionsConfig[category][0].id);
            }
        }

        function goBack() {
            localStorage.removeItem('torneo_categoria');
            localStorage.removeItem('torneo_tab');
            currentCategory = '';
            document.getElementById('category-selection').classList.remove('hidden');
            document.getElementById('tournament-dashboard').classList.add('hidden');
        }

        function renderButtons() {
            const btnContainer = document.getElementById('navigation-buttons');
            const sections = sectionsConfig[currentCategory];
            btnContainer.className = `grid grid-cols-2 md:grid-cols-${sections.length} gap-3 mb-8`;
            btnContainer.innerHTML = '';

            sections.forEach(sec => {
                const button = document.createElement('button');
                button.id = `btn-${sec.id}`;
                button.onclick = () => switchTab(sec.id);
                button.className = `flex flex-col items-center justify-center p-3 rounded-xl font-semibold text-sm bg-gray-800 text-gray-300 border border-gray-700 hover:bg-gray-700`;
                button.innerHTML = `<i class="fas ${sec.icon} text-lg mb-1"></i> ${sec.label}`;
                btnContainer.appendChild(button);
            });
        }

        function switchTab(tabId) {
            currentTab = tabId;
            localStorage.setItem('torneo_tab', tabId);

            sectionsConfig[currentCategory].forEach(sec => {
                const btn = document.getElementById(`btn-${sec.id}`);
                if (btn) btn.className = `flex flex-col items-center justify-center p-3 rounded-xl font-semibold text-sm bg-gray-800 text-gray-300 border border-gray-700 hover:bg-gray-700`;
            });

            const activeBtn = document.getElementById(`btn-${tabId}`);
            if (activeBtn) {
                let colorClass = 'border-amber-500 bg-amber-600';
                if (currentCategory === 'maschile') colorClass = 'border-sky-500 bg-sky-600';
                if (currentCategory === 'femminile') colorClass = 'border-pink-500 bg-pink-600';
                activeBtn.className = `flex flex-col items-center justify-center p-3 rounded-xl font-bold text-sm border ${colorClass} text-white shadow-lg`;
            }
            renderContent(tabId);
        }

        function cambiaFiltroGirone(valore) {
            filtroGironeAttivo = valore;
            renderContent(currentTab);
        }

        function cambiaFiltro3Point(sesso) {
            filtro3PointSesso = sesso;
            renderContent(currentTab);
        }

        function creaMenuFiltroGironi(listaPartite) {
            let gironiUnici = [...new Set(listaPartite.map(p => p.girone.toUpperCase().trim()))].sort();
            if (gironiUnici.length <= 1) return '';

            let html = `
            <div class="mb-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 bg-gray-850 p-3.5 rounded-xl border border-gray-700">
                <label for="select-girone" class="text-sm font-semibold text-gray-300 flex items-center gap-2">
                    <i class="fas fa-filter text-sky-400"></i> Filtra per Girone:
                </label>
                <select id="select-girone" onchange="cambiaFiltroGirone(this.value)" class="bg-gray-900 text-white font-medium text-sm rounded-lg border border-gray-600 p-2.5 focus:ring-2 focus:ring-sky-500 focus:outline-none w-full sm:w-auto">
                    <option value="tutti" ${filtroGironeAttivo === 'tutti' ? 'selected' : ''}>Tutti i Gironi</option>`;
            
            gironiUnici.forEach(g => {
                html += `<option value="${g}" ${filtroGironeAttivo === g ? 'selected' : ''}>${g}</option>`;
            });

            html += `</select></div>`;
            return html;
        }

        function renderContent(tabId) {
            const container = document.getElementById('section-content');

            if (tabId === '3point_leaderboard') {
                stampaSezione3PointQualificazioni(container);
                return;
            }

            if (tabId === '3point_bracket') {
                stampaSezione3PointTabellone(container);
                return;
            }

            const filtrate = DATA_PARTITE.filter(p => p.categoria === currentCategory);

            if (tabId === 'calendario') {
                const daGiocare = filtrate.filter(p => !p.giocata && !p.turno.toLowerCase().includes('playoff') && !p.turno.toLowerCase().includes('barilotto') && !p.girone.toLowerCase().trim().includes('1v1') && !p.girone.toLowerCase().trim().includes('3pt'));
                let listeFiltrata = daGiocare;
                if (filtroGironeAttivo !== 'tutti') {
                    listeFiltrata = daGiocare.filter(p => p.girone.toUpperCase().trim() === filtroGironeAttivo);
                }
                stampaListaPartite(container, listeFiltrata, daGiocare, "Prossime Partite", "fa-calendar-alt", currentCategory === 'maschile' ? "text-cyan-400" : "text-pink-400");
                
            } else if (tabId === 'risultati') {
                const giocate = filtrate.filter(p => p.giocata && !p.turno.toLowerCase().includes('playoff') && !p.turno.toLowerCase().includes('barilotto') && !p.girone.toLowerCase().trim().includes('1v1') && !p.girone.toLowerCase().trim().includes('3pt'));
                let listeFiltrata = giocate;
                if (filtroGironeAttivo !== 'tutti') {
                    listeFiltrata = giocate.filter(p => p.girone.toUpperCase().trim() === filtroGironeAttivo);
                }
                stampaListaRisultati(container, listeFiltrata, giocate, "Risultati Incontri", "fa-list-ol", "text-green-400");

            } else if (tabId === 'barilotto') {
                const matchBarilotto = filtrate.filter(p => p.turno.toLowerCase().includes('barilotto'));
                stampaSezioneBarilotto(container, matchBarilotto);

            } else if (tabId === 'playoff') {
                const matchPlayoff = filtrate.filter(p => p.turno.toLowerCase().includes('playoff'));
                stampaSezionePlayoff(container, matchPlayoff);

            } else if (tabId === 'classifica') {
                calcolaEMostraClassifica(container, filtrate);
                
            } else if (tabId === 'king') {
                const matchKing = filtrate.filter(p => p.girone.toLowerCase().trim().includes('1v1'));
                stampaSezioneKing(container, matchKing);
            }
        }

        // --- SEZIONE 3 POINT: QUALIFICAZIONI ---
        function stampaSezione3PointQualificazioni(container) {
            const partecipanti = [];

            DATA_PARTITE.forEach(p => {
                const e3pointQual = (p.girone.toUpperCase().trim() === '3PT') && !p.turno.toUpperCase().includes('PLAYOFF') && !p.turno.toUpperCase().includes('FINALE');
                if (e3pointQual && p.giocata) {
                    if (p.casa && p.casa.trim() !== '') {
                        partecipanti.push({ nome: p.casa, punteggio: p.puntiCasa, categoria: p.categoria });
                    }
                }
            });

            const filtratiPerSesso = partecipanti.filter(p => p.categoria === filtro3PointSesso);
            filtratiPerSesso.sort((a, b) => b.punteggio - a.punteggio);

            const sogliaPassaggio = filtro3PointSesso === 'maschile' ? 8 : 4;

            let html = `
            <div class="mb-6 flex justify-center gap-2 sm:gap-3">
                <button onclick="cambiaFiltro3Point('maschile')" class="px-3 sm:px-6 py-2.5 rounded-xl font-bold transition-all text-xs sm:text-sm flex items-center gap-2 ${filtro3PointSesso === 'maschile' ? 'bg-sky-600 text-white shadow-lg' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}">
                    <i class="fas fa-mars"></i> Maschile (Passano i primi 8)
                </button>
                <button onclick="cambiaFiltro3Point('femminile')" class="px-3 sm:px-6 py-2.5 rounded-xl font-bold transition-all text-xs sm:text-sm flex items-center gap-2 ${filtro3PointSesso === 'femminile' ? 'bg-pink-600 text-white shadow-lg' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}">
                    <i class="fas fa-venus"></i> Femminile (Passano le prime 4)
                </button>
            </div>

            <h3 class="text-xl font-bold mb-4 text-amber-500 flex items-center justify-center gap-2 text-center">
                <i class="fas fa-bullseye"></i> Fase di Qualificazione 3PT (${filtro3PointSesso === 'maschile' ? : })
            </h3>`;

            if (filtratiPerSesso.length === 0) {
                html += `<p class="text-gray-400 text-center py-8">.<br><span class="text-xs text-gray-500"></span></p>`;
            } else {
                html += `
                <div class="bg-gray-850 rounded-xl border border-gray-700 shadow-lg">
                    <table class="w-full text-left border-collapse table-fixed">
                        <thead>
                            <tr class="bg-gray-900 border-b border-gray-700 text-gray-400 text-[11px] sm:text-xs uppercase">
                                <th class="py-3 px-1.5 sm:px-3 w-8 sm:w-12 text-center">Pos</th>
                                <th class="py-3 px-2 sm:px-3">Tiratore</th>
                                <th class="py-3 px-1.5 sm:px-3 text-center w-14 sm:w-24">Punti</th>
                                <th class="py-3 px-1.5 sm:px-3 text-center w-28 sm:w-36">Stato</th>
                            </tr>
                        </thead>
                        <tbody>`;

                filtratiPerSesso.forEach((p, idx) => {
                    const pos = idx + 1;
                    const qualificato = pos <= sogliaPassaggio;
                    
                    let statusBadge = qualificato 
                        ? `<span class="inline-flex items-center justify-center gap-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[10px] sm:text-[11px] font-extrabold px-2 py-1 rounded-full uppercase tracking-tight whitespace-nowrap shadow-sm">
                            <i class="fas fa-check text-[9px]"></i> Qualificato
                           </span>`
                        : `<span class="inline-flex items-center justify-center gap-1 bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[10px] sm:text-[11px] font-extrabold px-2 py-1 rounded-full uppercase tracking-tight whitespace-nowrap opacity-75">
                            <i class="fas fa-times text-[9px]"></i> Eliminato
                           </span>`;

                    html += `
                    <tr class="border-b border-gray-800 hover:bg-gray-750 transition-colors ${qualificato ? 'bg-emerald-950/20' : ''}">
                        <td class="py-2.5 px-1.5 sm:px-3 text-center font-bold text-xs sm:text-sm ${qualificato ? 'text-emerald-400' : 'text-gray-500'}">${pos}</td>
                        <td class="py-2.5 px-2 sm:px-3 font-semibold text-gray-100 text-xs sm:text-base truncate">${p.nome}</td>
                        <td class="py-2.5 px-1.5 sm:px-3 text-center font-mono font-extrabold text-amber-400 text-base sm:text-lg bg-gray-900/30">${p.punteggio}</td>
                        <td class="py-2.5 px-1.5 sm:px-3 text-center">${statusBadge}</td>
                    </tr>`;
                });

                html += `
                        </tbody>
                    </table>
                </div>`;
            }

            container.innerHTML = html;
        }

        // --- SEZIONE 3 POINT: FASE FINALE (SEMIFINALI A SCONTRO DIRETTO E VINCITORE CON DIDASCALIA) ---
        function stampaSezione3PointTabellone(container) {
            let matchValidi = DATA_PARTITE.filter(p => p.categoria === filtro3PointSesso && (p.girone.toUpperCase().trim() === '3PT PLAYOFF' || p.turno.toUpperCase().includes('3PT PLAYOFF')));

            const didascalia3pt = INFO_3PT[filtro3PointSesso] ? `<p class="text-sm text-gray-300 mt-1 mb-4 italic font-sans text-center">${INFO_3PT[filtro3PointSesso]}</p>` : '';

            let htmlHeader = `
            <div class="mb-6 flex justify-center gap-2 sm:gap-3">
                <button onclick="cambiaFiltro3Point('maschile')" class="px-3 sm:px-6 py-2.5 rounded-xl font-bold transition-all text-xs sm:text-sm flex items-center gap-2 ${filtro3PointSesso === 'maschile' ? 'bg-sky-600 text-white shadow-lg' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}">
                    <i class="fas fa-mars"></i> Maschile (8 Qualificati)
                </button>
                <button onclick="cambiaFiltro3Point('femminile')" class="px-3 sm:px-6 py-2.5 rounded-xl font-bold transition-all text-xs sm:text-sm flex items-center gap-2 ${filtro3PointSesso === 'femminile' ? 'bg-pink-600 text-white shadow-lg' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}">
                    <i class="fas fa-venus"></i> Femminile (4 Qualificati)
                </button>
            </div>
            <div class="mb-4">
                <h3 class="text-xl font-bold text-amber-500 mb-1 flex items-center justify-center gap-2 text-center">
                    <i class="fas fa-sitemap"></i> Fase Finale 3PT (${filtro3PointSesso === 'maschile' ? 'Maschile' : 'Femminile'})
                </h3>
                ${didascalia3pt}
            </div>`;

            if(matchValidi.length === 0) {

        function calcolaEMostraClassifica(container, tutteLePartite) {
            let gironi = {};
            tutteLePartite.forEach(p => {
                if (!p.turno.toLowerCase().includes('playoff') && !p.turno.toLowerCase().includes('barilotto') && !p.girone.toLowerCase().trim().includes('1v1') && !p.girone.toLowerCase().trim().includes('3pt')) {
                    const gNome = p.girone.toUpperCase() || 'UNICO';
                    if (!gironi[gNome]) gironi[gNome] = {};
                    if (!gironi[gNome][p.casa]) gironi[gNome][p.casa] = { nome: p.casa, vinte: 0, perse: 0, punti: 0, fatti: 0, subiti: 0 };
                    if (!gironi[gNome][p.fuori]) gironi[gNome][p.fuori] = { nome: p.fuori, vinte: 0, perse: 0, punti: 0, fatti: 0, subiti: 0 };
                }
            });

            tutteLePartite.forEach(p => {
                if (p.giocata && !p.turno.toLowerCase().includes('playoff') && !p.turno.toLowerCase().includes('barilotto') && !p.girone.toLowerCase().trim().includes('1v1') && !p.girone.toLowerCase().trim().includes('3pt')) {
                    const gNome = p.girone.toUpperCase() || 'GENERALE';
                    if(gironi[gNome] && gironi[gNome][p.casa] && gironi[gNome][p.fuori]) {
                        gironi[gNome][p.casa].fatti += p.puntiCasa;
                        gironi[gNome][p.casa].subiti += p.puntiFuori;
                        gironi[gNome][p.fuori].fatti += p.puntiFuori;
                        gironi[gNome][p.fuori].subiti += p.puntiCasa;

                        if (p.puntiCasa > p.puntiFuori) {
                            gironi[gNome][p.casa].vinte += 1;
                            gironi[gNome][p.casa].punti += 2;
                            gironi[gNome][p.fuori].perse += 1;
                        } else {
                            gironi[gNome][p.fuori].vinte += 1;
                            gironi[gNome][p.fuori].punti += 2;
                            gironi[gNome][p.casa].perse += 1;
                        }
                    }
                }
            });

            let html = `<h3 class="text-xl font-bold mb-6 text-yellow-500"><i class="fas fa-trophy mr-2"></i>Classifiche dei Gironi</h3>`;
            const gironiOrdinati = Object.keys(gironi).sort();
            
            if (gironiOrdinati.length === 0) { 
                container.innerHTML = `<p class="text-gray-400 text-center py-8">Inserisci le partite nel foglio per generare le classifiche.</p>`; 
                return; 
            }

            gironiOrdinati.forEach(gNome => {
                let ordinata = Object.values(gironi[gNome]).sort((a, b) => {
                    if (b.punti !== a.punti) return b.punti - a.punti;
                    return (b.fatti - b.subiti) - (a.fatti - a.subiti);
                });

                const colorGirone = currentCategory === 'maschile' ? 'text-sky-400' : 'text-pink-500';

                html += `<div class="mb-6 bg-gray-850 p-3 sm:p-4 rounded-xl border border-gray-700 shadow-lg">
                            <h4 class="text-base font-bold mb-3 ${colorGirone} border-b border-gray-700 pb-1 uppercase tracking-wider">${gNome}</h4>
                            <div class="overflow-x-auto"><table class="w-full text-left border-collapse text-sm sm:text-base">
                            <thead><tr class="border-b border-gray-800 text-gray-400 text-xs uppercase">
                                <th class="py-2 px-2 w-10">Pos</th><th class="py-2">Squadra</th>
                                <th class="py-2 text-center w-14">Pti</th><th class="py-2 text-center w-10">V</th><th class="py-2 text-center w-10">P</th>
                                <th class="py-2 text-center w-14 hidden sm:table-cell">Diff</th>
                            </tr></thead><tbody>`;
                
                ordinata.forEach((sq, index) => {
                    const diff = sq.fatti - sq.subiti;
                    html += `<tr class="border-b border-gray-800 hover:bg-gray-750 transition-colors">
                                <td class="py-2 px-2 font-bold text-gray-500">${index + 1}</td>
                                <td class="py-2 font-semibold text-gray-200 truncate max-w-[120px] sm:max-w-none">${sq.nome}</td>
                                <td class="py-2 text-center font-bold text-green-400">${sq.punti}</td>
                                <td class="py-2 text-center text-xs">${sq.vinte}</td>
                                <td class="py-2 text-center text-xs">${sq.perse}</td>
                                <td class="py-2 text-center text-xs text-gray-400 hidden sm:table-cell font-mono">${diff > 0 ? '+' + diff : diff}</td>
                             </tr>`;
                });
                html += `</tbody></table></div></div>`;
            });

            container.innerHTML = html;
        }

        function stampaSezioneKing(container, lista) {
            let matchValiviRaw = lista.filter(p => p.turno && p.turno.trim() !== "");
            let matchValidi = matchValiviRaw.filter(p => p.casa.trim() !== "" || p.fuori.trim() !== "" || p.giocata);

            const titoloKing = currentCategory === 'femminile' ? 'Queen of the Court 1v1' : 'King of the Court 1v1';
            const didascalia = INFO_KING[currentCategory] ? `<p class="text-sm text-gray-300 mt-1 mb-4 italic font-sans">${INFO_KING[currentCategory]}</p>` : '';

            if(matchValidi.length === 0) { 
                container.innerHTML = `<div class="mb-4">

                                        </div>

                return; 
            }

            let turniOrdinati = [];
            matchValidi.forEach(p => {
                if (!turniOrdinati.includes(p.turno)) turniOrdinati.push(p.turno);
            });

            let colonneTabellone = [];
            
            function getVincitore(match) {
                if (!match || !match.giocata) return "Da definire";
                return match.puntiCasa > match.puntiFuori ? match.casa : match.fuori;
            }

            for (let tIdx = 0; tIdx < turniOrdinati.length; tIdx++) {
                let nomeTurnoCorrente = turniOrdinati[tIdx];
                let matchFoglio = matchValidi.filter(p => p.turno === nomeTurnoCorrente);
                let matchDellaColonna = [];
                
                if (tIdx === 0) {
                    matchDellaColonna = matchFoglio.map(p => ({
                        casa: p.casa || "Da definire",
                        fuori: p.fuori || "Da definire",
                        puntiCasa: p.puntiCasa,
                        puntiFuori: p.puntiFuori,
                        giocata: p.giocata,
                        data: p.data,
                        orario: p.orario,
                        campo: p.campo
                    }));
                } else {
                    let colonnaPrecedente = colonneTabellone[tIdx - 1];
                    let nrMatchAttesi = Math.ceil(colonnaPrecedente.match.length / 2);
                    
                    for (let i = 0; i < nrMatchAttesi; i++) {
                        let m1 = colonnaPrecedente.match[i * 2];
                        let m2 = colonnaPrecedente.match[i * 2 + 1];
                        
                        let autoCasa = m1 ? getVincitore(m1) : "Da definire";
                        let autoFuori = m2 ? getVincitore(m2) : "Da definire";
                        
                        let p = matchFoglio[i];
                        
                        if (p) {
                            matchDellaColonna.push({
                                casa: (p.casa && p.casa.trim() !== "" && p.casa !== "Da definire") ? p.casa : autoCasa,
                                fuori: (p.fuori && p.fuori.trim() !== "" && p.fuori !== "Da definire") ? p.fuori : autoFuori,
                                puntiCasa: p.puntiCasa,
                                puntiFuori: p.puntiFuori,
                                giocata: p.giocata,
                                data: p.data,
                                orario: p.orario,
                                campo: p.campo
                            });
                        } else {
                            matchDellaColonna.push({
                                casa: autoCasa,
                                fuori: autoFuori,
                                puntiCasa: 0,
                                puntiFuori: 0,
                                giocata: false,
                                data: "",
                                orario: "",
                                campo: ""
                            });
                        }
                    }
                }
                
                colonneTabellone.push({
                    nome: nomeTurnoCorrente,
                    match: matchDellaColonna
                });
            }

            let html = `<div class="mb-4">
                            <h3 class="text-xl font-bold text-purple-400 flex items-center gap-2"><i class="fas fa-medal"></i> ${titoloKing}</h3>
                            ${didascalia}
                        </div>`;
            
            html += `<div class="bracket-container flex flex-col md:flex-row gap-6 pb-4 pt-2">`;
            
            colonneTabellone.forEach(col => {
                html += `<div class="bracket-column flex-1 bg-gray-850 p-3 sm:p-4 rounded-xl border border-gray-700 flex flex-col">
                            <h4 class="text-xs font-extrabold text-purple-400 uppercase tracking-wider text-center border-b border-gray-700 pb-2 mb-3 font-mono">${col.nome}</h4>
                            <div class="flex flex-col gap-3">`;
                
                col.match.forEach(m => {
                    const casaVincente = m.giocata && m.puntiCasa > m.puntiFuori;
                    const fuoriVincente = m.giocata && m.puntiFuori > m.puntiCasa;
                    
                    let infoKing = [];
                    if (m.data && m.data !== "Da definire" && m.data.trim() !== "") infoKing.push(m.data);
                    if (m.orario && m.orario.trim() !== "") infoKing.push(`<b>${m.orario}</b>`);
                    if (m.campo && m.campo.trim() !== "") infoKing.push(`<b>${m.campo}</b>`);
                    
                    let footerHTML = '';
                    if (!m.giocata && infoKing.length > 0) {
                        footerHTML = `<div class="bg-gray-750 text-[11px] text-gray-300 text-center py-1 border-t border-gray-600/30 font-mono">
                                        ${infoKing.join(' • ')}
                                      </div>`;
                    }
                    
                    html += `<div class="bg-gray-700 rounded-lg border border-gray-600 overflow-hidden shadow border-l-4 ${m.giocata ? 'border-l-purple-500' : 'border-l-gray-500'}">
                                <div class="flex justify-between items-center px-3 py-2 border-b border-gray-600/50 ${casaVincente ? 'bg-purple-600/10' : ''}">
                                    <span class="team-name text-sm ${m.giocata ? (casaVincente ? 'font-bold text-purple-300' : 'text-gray-500 line-through') : (m.casa === 'Da definire' ? 'text-gray-500 italic' : 'text-gray-100 font-semibold')}">
                                        ${casaVincente ? '👑 ' : ''}${m.casa}

                html += `   </div>

            colonne.forEach(col => {
                const colorTitle = currentCategory === 'maschile' ? 'text-sky-400' : 'text-pink-500';
                html += `<div class="bracket-column flex-1 bg-gray-850 p-3 sm:p-4 rounded-xl border border-gray-700 flex flex-col">
                            <h4 class="text-xs font-extrabold ${colorTitle} uppercase tracking-wider text-center border-b border-gray-700 pb-2 mb-3 font-mono">${col.nome}</h4>
                            <div class="flex flex-col gap-3">`;

                col.match.forEach((m, idx) => {
                    let segnapostoCasa = "Da definire";
                    let segnapostoFuori = "Da definire";

                    if (col.tipo === "quarti") {
                        if (currentCategory === 'maschile') {
                            if (idx === 0) { segnapostoCasa = "1° Girone A"; segnapostoFuori = "4° Girone B"; }
                            if (idx === 1) { segnapostoCasa = "2° Girone B"; segnapostoFuori = "3° Girone A"; }
                            if (idx === 2) { segnapostoCasa = "1° Girone B"; segnapostoFuori = "4° Girone A"; }
                            if (idx === 3) { segnapostoCasa = "2° Girone A"; segnapostoFuori = "3° Girone B"; }
                        } else {
                            if (idx === 0) { segnapostoCasa = "3° Girone Unico"; segnapostoFuori = "6° Girone Unico"; }
                            if (idx === 1) { segnapostoCasa = "4° Girone Unico"; segnapostoFuori = "5° Girone Unico"; }
                        }
                    } else if (col.tipo === "semifinali") {
                        if (currentCategory === 'maschile') {
                            if (quarti.length > 0) {
                                if (idx === 0) { segnapostoCasa = "Vinc. Quarti 1"; segnapostoFuori = "Vinc. Quarti 2"; }
                                if (idx === 1) { segnapostoCasa = "Vinc. Quarti 3"; segnapostoFuori = "Vinc. Quarti 4"; }
                            } else {
                                if (idx === 0) { segnapostoCasa = "1° Girone A"; segnapostoFuori = "2° Girone B"; }
                                if (idx === 1) { segnapostoCasa = "1° Girone B"; segnapostoFuori = "2° Girone A"; }
                            }
                        } else {
                            if (idx === 0) { segnapostoCasa = "1° Girone Unico"; segnapostoFuori = "Vinc. Quarti 1"; }
                            if (idx === 1) { segnapostoCasa = "2° Girone Unico"; segnapostoFuori = "Vinc. Quarti 2"; }
                        }
                    } else if (col.tipo === "finale") {
                        segnapostoCasa = "Vinc. Semi 1";
                        segnapostoFuori = "Vinc. Semi 2";
                    }

                    const nomeCasa = m.casa && m.casa.trim() !== "" ? m.casa : segnapostoCasa;
                    const nomeFuori = m.fuori && m.fuori.trim() !== "" ? m.fuori : segnapostoFuori;

                    const casaVincente = m.giocata && m.puntiCasa > m.puntiFuori;
                    const fuoriVincente = m.giocata && m.puntiFuori > m.puntiCasa;

                    let infoMatch = [];
                    if (m.data && m.data.trim() !== "") infoMatch.push(m.data);
                    if (m.orario && m.orario.trim() !== "") infoMatch.push(`<b>${m.orario}</b>`);
                    if (m.campo && m.campo.trim() !== "") infoMatch.push(`<b>${m.campo}</b>`);

                    let footerHTML = '';
                    if (!m.giocata && infoMatch.length > 0) {
                        footerHTML = `<div class="bg-gray-750 text-[11px] text-gray-300 text-center py-1 border-t border-gray-600/30 font-mono">
                                        ${infoMatch.join(' • ')}
                                      </div>`;
                    }

                    html += `<div class="bg-gray-700 rounded-lg border border-gray-600 overflow-hidden shadow border-l-4 ${m.giocata ? 'border-l-yellow-500' : 'border-l-gray-500'}">
                                <div class="flex justify-between items-center px-3 py-2 border-b border-gray-600/50 ${casaVincente ? 'bg-yellow-600/10' : ''}">
                                    <span class="team-name text-sm ${m.giocata ? (casaVincente ? 'font-bold text-yellow-300' : 'text-gray-500 line-through') : (m.casa && m.casa.trim() !== "" ? 'text-gray-100 font-semibold' : 'text-gray-400 italic text-xs')}">
                                        ${casaVincente ? '👑 ' : ''}${nomeCasa}
                                    </span>
                                    ${m.giocata ? `<span class="font-mono font-bold text-sm ${casaVincente ? 'text-yellow-400' : 'text-gray-400'}">${m.puntiCasa}</span>` : ''}
                                </div>
                                <div class="flex justify-between items-center px-3 py-2 ${fuoriVincente ? 'bg-yellow-600/10' : ''}">
                                    <span class="team-name text-sm ${m.giocata ? (fuoriVincente ? 'font-bold text-yellow-300' : 'text-gray-500 line-through') : (m.fuori && m.fuori.trim() !== "" ? 'text-gray-100 font-semibold' : 'text-gray-400 italic text-xs')}">
                                        ${fuoriVincente ? '👑 ' : ''}${nomeFuori}
                                    </span>
                                    ${m.giocata ? `<span class="font-mono font-bold text-sm ${fuoriVincente ? 'text-yellow-400' : 'text-gray-400'}">${m.puntiFuori}</span>` : ''}
                                </div>
                                ${footerHTML}
                             </div>`;
                });

                html += `   </div>
                         </div>`;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function stampaSezioneBarilotto(container, lista) {
            let matchValidi = lista.filter(p => p.turno && p.turno.trim() !== "");

            if(matchValidi.length === 0) { 
                container.innerHTML = `<h3 class="text-xl font-bold mb-4 text-amber-500"><i class="fas fa-beer mr-2"></i>Torneo Barilotto</h3><p class="text-gray-400 text-center py-8">In attesa dell'inserimento dei match del Torneo Barilotto nel foglio.</p>`; 
                return; 
            }

            let preliminari = matchValidi.filter(p => p.turno.toLowerCase().includes('preliminar') || p.turno.toLowerCase().includes('primo turno'));
            let quarti = matchValidi.filter(p => p.turno.toLowerCase().includes('quarti'));
            let semifinali = matchValidi.filter(p => p.turno.toLowerCase().includes('semifinale') || p.turno.toLowerCase().includes('semi'));
            let finale = matchValidi.filter(p => p.turno.toLowerCase().includes('finale') && !p.turno.toLowerCase().includes('semi'));

            let colonne = [];
            if (preliminari.length > 0) colonne.push({ nome: "Turno Preliminare", match: preliminari, tipo: "preliminari" });
            if (quarti.length > 0) colonne.push({ nome: "Quarti Barilotto", match: quarti, tipo: "quarti" });
            if (semifinali.length > 0) colonne.push({ nome: "Semifinali Barilotto", match: semifinali, tipo: "semifinali" });
            if (finale.length > 0) colonne.push({ nome: "Finale Barilotto", match: finale, tipo: "finale" });

            let html = `<div class="mb-4">
                            <h3 class="text-xl font-bold text-amber-500 flex items-center gap-2"><i class="fas fa-beer"></i> Torneo Barilotto</h3>
                        </div>`;
            
            html += `<div class="bracket-container flex flex-col md:flex-row gap-6 pb-4 pt-2">`;

            colonne.forEach(col => {
                html += `<div class="bracket-column flex-1 bg-gray-850 p-3 sm:p-4 rounded-xl border border-gray-700 flex flex-col">
                            <h4 class="text-xs font-extrabold text-amber-500 uppercase tracking-wider text-center border-b border-gray-700 pb-2 mb-3 font-mono">${col.nome}</h4>
                            <div class="flex flex-col gap-3">`;

                col.match.forEach((m, idx) => {
                    let segnapostoCasa = "Da definire";
                    let segnapostoFuori = "Da definire";

                    if (col.tipo === "preliminari") {
                        if (idx === 0) { segnapostoCasa = "5° Girone B"; segnapostoFuori = "6° Girone B"; }
                        if (idx === 1) { segnapostoCasa = "5° Girone A"; segnapostoFuori = "7° Girone B"; }
                    } else if (col.tipo === "quarti") {
                        if (idx === 0) { segnapostoCasa = "Perd. Quarti 1"; segnapostoFuori = "Perd. Quarti 2"; }
                        if (idx === 1) { segnapostoCasa = "Perd. Quarti 3"; segnapostoFuori = "Perd. Quarti 4"; }
                        if (idx === 2) { segnapostoCasa = "6° Girone A"; segnapostoFuori = "Vinc. Preliminare 1"; }
                        if (idx === 3) { segnapostoCasa = "Vinc. Preliminare 2"; segnapostoFuori = "Da definire"; }
                    } else if (col.tipo === "semifinali") {
                        segnapostoCasa = `Vinc. Quarti Barilotto ${idx * 2 + 1}`;
                        segnapostoFuori = `Vinc. Quarti Barilotto ${idx * 2 + 2}`;
                    } else if (col.tipo === "finale") {
                        segnapostoCasa = "Vinc. Semi Barilotto 1";
                        segnapostoFuori = "Vinc. Semi Barilotto 2";
                    }

                    const nomeCasa = m.casa && m.casa.trim() !== "" ? m.casa : segnapostoCasa;
                    const nomeFuori = m.fuori && m.fuori.trim() !== "" ? m.fuori : segnapostoFuori;

                    const casaVincente = m.giocata && m.puntiCasa > m.puntiFuori;
                    const fuoriVincente = m.giocata && m.puntiFuori > m.puntiCasa;

                    let infoMatch = [];
                    if (m.data && m.data.trim() !== "") infoMatch.push(m.data);
                    if (m.orario && m.orario.trim() !== "") infoMatch.push(`<b>${m.orario}</b>`);
                    if (m.campo && m.campo.trim() !== "") infoMatch.push(`<b>${m.campo}</b>`);

                    let footerHTML = '';
                    if (!m.giocata && infoMatch.length > 0) {
                        footerHTML = `<div class="bg-gray-750 text-[11px] text-gray-300 text-center py-1 border-t border-gray-600/30 font-mono">
                                        ${infoMatch.join(' • ')}
                                      </div>`;
                    }

                    html += `<div class="bg-gray-700 rounded-lg border border-gray-600 overflow-hidden shadow border-l-4 ${m.giocata ? 'border-l-amber-500' : 'border-l-gray-500'}">
                                <div class="flex justify-between items-center px-3 py-2 border-b border-gray-600/50 ${casaVincente ? 'bg-amber-600/10' : ''}">
                                    <span class="team-name text-sm ${m.giocata ? (casaVincente ? 'font-bold text-amber-300' : 'text-gray-500 line-through') : (m.casa && m.casa.trim() !== "" ? 'text-gray-100 font-semibold' : 'text-gray-400 italic text-xs')}">
                                        ${casaVincente ? '👑 ' : ''}${nomeCasa}
                                    </span>
                                    ${m.giocata ? `<span class="font-mono font-bold text-sm ${casaVincente ? 'text-yellow-400' : 'text-gray-400'}">${m.puntiCasa}</span>` : ''}
                                </div>
                                <div class="flex justify-between items-center px-3 py-2 ${fuoriVincente ? 'bg-amber-600/10' : ''}">
                                    <span class="team-name text-sm ${m.giocata ? (fuoriVincente ? 'font-bold text-amber-300' : 'text-gray-500 line-through') : (m.fuori && m.fuori.trim() !== "" ? 'text-gray-100 font-semibold' : 'text-gray-400 italic text-xs')}">
                                        ${fuoriVincente ? '👑 ' : ''}${nomeFuori}
                                    </span>
                                    ${m.giocata ? `<span class="font-mono font-bold text-sm ${fuoriVincente ? 'text-yellow-400' : 'text-gray-400'}">${m.puntiFuori}</span>` : ''}
                                </div>
                                ${footerHTML}
                             </div>`;
                });

                html += `   </div>
                         </div>`;
            });

            html += `</div>`;
            container.innerHTML = html;
        }
    </script>
</body>
